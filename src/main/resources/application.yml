spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paygate}
    username: ${DATABASE_USER:paygate}
    password: ${DATABASE_PASSWORD:paygate}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  application:
    name: paygate
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
